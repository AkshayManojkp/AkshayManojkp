  <!-- ============ ANIMATED LAYERS (3s glitch) ============ -->

  <!-- Base layer with jitter -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 0; -3 1; 3 -1; -2 1; 2 -1; 0 0; 0 0"
      keyTimes="0; 0.88; 0.90; 0.92; 0.94; 0.96; 0.98; 1"
      dur="3s" repeatCount="indefinite"/>
    <use href="#badges-static"/>
  </g>

  <!-- Red ghost -->
  <g opacity="0" filter="url(#toRed)">
    <animate attributeName="opacity" values="0; 0; 0.7; 0.7; 0; 0"
      keyTimes="0; 0.88; 0.90; 0.96; 0.98; 1" dur="3s" repeatCount="indefinite"/>
    <g transform="translate(-4 0)">
      <use href="#badges-static"/>
    </g>
  </g>

  <!-- Cyan ghost -->
  <g opacity="0" filter="url(#toCyan)">
    <animate attributeName="opacity" values="0; 0; 0.7; 0.7; 0; 0"
      keyTimes="0; 0.88; 0.90; 0.96; 0.98; 1" dur="3s" repeatCount="indefinite"/>
    <g transform="translate(4 0)">
      <use href="#badges-static"/>
    </g>
  </g>

</svg>
