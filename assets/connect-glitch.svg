    </g>

    <!-- ===== ROW 2 (y=160, centered, 730px total) ===== -->

    <!-- Google Dev -->
    <g transform="translate(115 160)">
      <rect width="110" height="36" rx="4" fill="#FBBF24"/>
      <rect x="110" width="100" height="36" rx="4" fill="#22C55E"/>
      <g transform="translate(6 6)">
