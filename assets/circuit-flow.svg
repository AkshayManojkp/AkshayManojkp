<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
  <defs>
    <!-- ============ NEON FLOW (circuit wave) ============ -->
    <linearGradient id="neonFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#00F5D4" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
      <animate attributeName="x1" values="-40%;0%;-40%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-40%;0%;-40%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60%;100%;60%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60%;100%;60%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ============ TRACE BASE ============ -->
    <linearGradient id="traceBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b1230"/>
      <stop offset="50%"  stop-color="#0a1028"/>
      <stop offset="100%" stop-color="#070b1f"/>
    </linearGradient>

    <!-- ============ NODE VIAS ============ -->
    <radialGradient id="nodeBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a2550"/>
      <stop offset="100%" stop-color="#0a1028"/>
    </radialGradient>

    <!-- ============ SILVER NAME GRADIENT — SLOW METALLIC SWEEP ============ -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3a4152"/>
      <stop offset="20%"  stop-color="#8a92a6"/>
      <stop offset="40%"  stop-color="#e8ecf5"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8ecf5"/>
      <stop offset="80%"  stop-color="#8a92a6"/>
      <stop offset="100%" stop-color="#3a4152"/>
      <animate attributeName="x1" values="-100%;0%;-100%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;0%" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ============ SUBTITLE SILVER — BRIGHTER, VISIBLE, SLOW SWEEP ============ -->
    <linearGradient id="silverSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6a7382"/>
      <stop offset="40%"  stop-color="#c8d0dc"/>
      <stop offset="50%"  stop-color="#f0f4fa"/>
      <stop offset="60%"  stop-color="#c8d0dc"/>
      <stop offset="100%" stop-color="#6a7382"/>
      <animate attributeName="x1" values="-100%;0%;-100%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ============ SILVER GLOW ============ -->
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ============ TRACE GLOW ============ -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- ============ AMBIENT CORNER GLOWS ============ -->
    <radialGradient id="cornerGlowTL" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="#00F5D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowBR" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ BASE LAYER ============ -->
  <rect width="1200" height="400" fill="#050816"/>
  <rect width="1200" height="400" fill="url(#cornerGlowTL)"/>
  <rect width="1200" height="400" fill="url(#cornerGlowBR)"/>

  <!-- ============ STATIC CIRCUIT TRACES ============ -->
  <g stroke="url(#traceBase)" stroke-width="1.5" fill="none"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0 60  H280 L320 100 H640 L680 60  H1200"/>
    <path d="M0 140 H180 L220 100 H480 L520 140 H860 L900 100 H1200"/>
    <path d="M0 220 H360 L400 180 H720 L760 220 H1040 L1080 180 H1200"/>
    <path d="M0 300 H140 L180 260 H560 L600 300 H960 L1000 260 H1200"/>
    <path d="M0 370 H420 L460 330 H820 L860 370 H1200"/>

    <path d="M120 0 V80  L160 120 V300 L200 340 V400"/>
    <path d="M400 0 V60  L440 100 V240 L480 280 V400"/>
    <path d="M680 0 V140 L720 180 V320 L760 360 V400"/>
    <path d="M960 0 V100 L1000 140 V280 L1040 320 V400"/>
    <path d="M1120 0 V180 L1160 220 V400"/>

    <path d="M240 0   L300 60  L360 0"/>
    <path d="M520 0   L580 60  L640 0"/>
    <path d="M800 0   L860 60  L920 0"/>
    <path d="M300 400 L360 340 L420 400"/>
    <path d="M600 400 L660 340 L720 400"/>
    <path d="M900 400 L960 340 L1020 400"/>
  </g>

  <!-- ============ STATIC NODES / VIAS ============ -->
  <g fill="url(#nodeBase)" stroke="#0e1a3a" stroke-width="0.5">
    <circle cx="280"  cy="60"  r="3.5"/><circle cx="640"  cy="60"  r="3.5"/>
    <circle cx="180"  cy="140" r="3.5"/><circle cx="520"  cy="140" r="3.5"/>
    <circle cx="900"  cy="100" r="3.5"/><circle cx="360"  cy="220" r="3.5"/>
    <circle cx="760"  cy="220" r="3.5"/><circle cx="1080" cy="180" r="3.5"/>
    <circle cx="560"  cy="300" r="3.5"/><circle cx="960"  cy="300" r="3.5"/>
    <circle cx="420"  cy="370" r="3.5"/><circle cx="860"  cy="370" r="3.5"/>
    <circle cx="160"  cy="120" r="3"/>  <circle cx="440"  cy="100" r="3"/>
    <circle cx="720"  cy="180" r="3"/>  <circle cx="1000" cy="140" r="3"/>
    <circle cx="480"  cy="280" r="3"/>  <circle cx="760"  cy="360" r="3"/>
  </g>

  <!-- ============ NEON PULSE LAYER ============ -->
  <g stroke="url(#neonFlow)" stroke-width="2" fill="none"
     stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)">
    <path d="M0 60  H280 L320 100 H640 L680 60  H1200"/>
    <path d="M0 140 H180 L220 100 H480 L520 140 H860 L900 100 H1200"/>
    <path d="M0 220 H360 L400 180 H720 L760 220 H1040 L1080 180 H1200"/>
    <path d="M0 300 H140 L180 260 H560 L600 300 H960 L1000 260 H1200"/>
    <path d="M0 370 H420 L460 330 H820 L860 370 H1200"/>
    <path d="M120 0 V80  L160 120 V300 L200 340 V400"/>
    <path d="M400 0 V60  L440 100 V240 L480 280 V400"/>
    <path d="M680 0 V140 L720 180 V320 L760 360 V400"/>
    <path d="M960 0 V100 L1000 140 V280 L1040 320 V400"/>
    <path d="M1120 0 V180 L1160 220 V400"/>
  </g>

  <!-- ============ TRAVELING WAVE-HEAD DOTS (slower to match) ============ -->
  <circle r="3" fill="#00F5D4" filter="url(#nodeGlow)">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M0 60 H280 L320 100 H640 L680 60 H1200"/>
  </circle>
  <circle r="3" fill="#A78BFA" filter="url(#nodeGlow)">
    <animateMotion dur="10s" repeatCount="indefinite"
      path="M0 140 H180 L220 100 H480 L520 140 H860 L900 100 H1200"/>
  </circle>
  <circle r="3" fill="#7C3AED" filter="url(#nodeGlow)">
    <animateMotion dur="11s" repeatCount="indefinite"
      path="M0 220 H360 L400 180 H720 L760 220 H1040 L1080 180 H1200"/>
  </circle>
  <circle r="3" fill="#FACC15" filter="url(#nodeGlow)">
    <animateMotion dur="13s" repeatCount="indefinite"
      path="M0 300 H140 L180 260 H560 L600 300 H960 L1000 260 H1200"/>
  </circle>
  <circle r="2.5" fill="#00F5D4" filter="url(#nodeGlow)">
    <animateMotion dur="12s" repeatCount="indefinite"
      path="M120 0 V80 L160 120 V300 L200 340 V400"/>
  </circle>
  <circle r="2.5" fill="#7C3AED" filter="url(#nodeGlow)">
    <animateMotion dur="14s" repeatCount="indefinite"
      path="M680 0 V140 L720 180 V320 L760 360 V400"/>
  </circle>

  <!-- ============ DARK SCRIM — PROPORTIONALLY CENTERED ============ -->
  <rect x="0" y="110" width="1200" height="180" fill="#050816" opacity="0.62"/>

  <!-- ============ NAME — SILVER, SLOW SHEEN ============ -->
  <!-- Baseline y=205, cap-height ~46px → occupies y≈159 to y≈205 -->
  <text x="600" y="205"
        font-family="'Fira Code','JetBrains Mono',monospace"
        font-size="62"
        font-weight="700"
        text-anchor="middle"
        fill="url(#silverGrad)"
        filter="url(#silverGlow)"
        letter-spacing="8">
    AKSHAY MANOJ KP
  </text>

  <!-- ============ JAPANESE SUBTITLE — BRIGHTER, VISIBLE ============ -->
  <!-- Tighter gap below name, larger size for legibility -->
  <text x="600" y="252"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"
        font-size="22"
        font-weight="500"
        text-anchor="middle"
        fill="url(#silverSub)"
        opacity="0.95"
        letter-spacing="5">
    アクシャイ・マノージ・KP
  </text>

  <!-- ============ SILVER ACCENT RULE — CENTERED ============ -->
  <!-- Symmetric length to match name width visually -->
  <rect x="440" y="272" width="320" height="2" fill="url(#silverGrad)" opacity="0.8"/>

</svg>
