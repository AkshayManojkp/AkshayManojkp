<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="none">
  <defs>
    <!-- ============ SOFT WAVE ============ -->
    <linearGradient id="softWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F5D4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ FAINT CIRCUIT ============ -->
    <linearGradient id="faintCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#070b1f"/>
    </linearGradient>

    <!-- ============ TEXT GLOW ============ -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ============ EDGE FADES (all four sides) ============ -->

    <!-- Top fade: page bg → transparent -->
    <linearGradient id="fadeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#050816" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom fade: transparent → page bg -->
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#050816" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="1"/>
    </linearGradient>

    <!-- Left fade: page bg → transparent -->
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050816" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>

    <!-- Right fade: transparent → page bg -->
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050816" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- ============ BASE ============ -->
  <rect width="1200" height="420" fill="#050816"/>

  <!-- ============ FAINT CIRCUIT TRACES ============ -->
  <g stroke="url(#faintCircuit)" stroke-width="1.2" fill="none"
     stroke-linecap="square" stroke-linejoin="miter" opacity="0.35">
    <path d="M0 60  H280 L320 100 H640 L680 60  H1200"/>
    <path d="M0 140 H180 L220 100 H480 L520 140 H860 L900 100 H1200"/>
    <path d="M0 220 H360 L400 180 H720 L760 220 H1040 L1080 180 H1200"/>
    <path d="M0 300 H140 L180 260 H560 L600 300 H960 L1000 260 H1200"/>
    <path d="M0 370 H420 L460 330 H820 L860 370 H1200"/>
    <path d="M120 0 V80  L160 120 V300 L200 340 V420"/>
    <path d="M400 0 V60  L440 100 V240 L480 280 V420"/>
    <path d="M680 0 V140 L720 180 V320 L760 360 V420"/>
    <path d="M960 0 V100 L1000 140 V280 L1040 320 V420"/>
    <path d="M1120 0 V180 L1160 220 V420"/>
  </g>

  <!-- ============ NODES ============ -->
  <g fill="#0e1a3a" opacity="0.5">
    <circle cx="280" cy="60" r="3"/><circle cx="640" cy="60" r="3"/>
    <circle cx="180" cy="140" r="3"/><circle cx="520" cy="140" r="3"/>
    <circle cx="900" cy="100" r="3"/><circle cx="360" cy="220" r="3"/>
    <circle cx="760" cy="220" r="3"/><circle cx="1080" cy="180" r="3"/>
    <circle cx="560" cy="300" r="3"/><circle cx="960" cy="300" r="3"/>
  </g>

  <!-- ============ SOFT WAVE ============ -->
  <path d="M0 260 Q300 190 600 260 T1200 260" fill="none"
        stroke="url(#softWave)" stroke-width="2" filter="url(#textGlow)">
    <animate attributeName="d"
             values="M0 260 Q300 190 600 260 T1200 260;
                     M0 260 Q300 330 600 260 T1200 260;
                     M0 260 Q300 190 600 260 T1200 260"
             dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- ============ DARK SCRIM (focus area for text) ============ -->
  <rect x="0" y="120" width="1200" height="150" fill="#050816" opacity="0.7"/>

  <!-- ============ MAIN NAME ============ -->
  <text x="600" y="205"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="72"
        font-weight="800"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#textGlow)"
        letter-spacing="6">
    AKSHAY MANOJ KP
  </text>

  <!-- ============ JAPANESE SUBTITLE ============ -->
  <text x="600" y="252"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"
        font-size="22"
        font-weight="400"
        text-anchor="middle"
        fill="#8a92a6"
        letter-spacing="6">
    アクシャイ・マノージ・KP
  </text>

  <!-- ============ ACCENT DOTS ============ -->
  <circle cx="450" cy="275" r="2" fill="#00F5D4" opacity="0.8"/>
  <circle cx="750" cy="275" r="2" fill="#00F5D4" opacity="0.8"/>

  <!-- ============ EDGE FADES (drawn last = on top of everything) ============ -->

  <!-- Top edge fade (height: 90px) -->
  <rect x="0" y="0" width="1200" height="90" fill="url(#fadeTop)"/>

  <!-- Bottom edge fade (height: 130px) -->
  <rect x="0" y="290" width="1200" height="130" fill="url(#fadeBottom)"/>

  <!-- Left edge fade (width: 160px) -->
  <rect x="0" y="0" width="160" height="420" fill="url(#fadeLeft)"/>

  <!-- Right edge fade (width: 160px) -->
  <rect x="1040" y="0" width="160" height="420" fill="url(#fadeRight)"/>
</svg>
