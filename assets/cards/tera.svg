<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Tera — TeraMyst product foundation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/><stop offset="1" stop-color="#061d23"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22c55e" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".45" stop-color="#050816" stop-opacity="1"/><stop offset=".75" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <rect width="600" height="320" fill="url(#grid)"/>

    <!-- binary rain, carried over from the original projects matrix -->
    <g fill="#22c55e" font-family="'Fira Code',Consolas,monospace" font-size="13" opacity=".35">
      <text x="430" y="-20" writing-mode="tb">0101 1101 0010<animate attributeName="y" from="-160" to="340" dur="6s" repeatCount="indefinite"/></text>
      <text x="470" y="-80" writing-mode="tb">1100 0110 1011<animate attributeName="y" from="-200" to="340" dur="7.4s" repeatCount="indefinite"/></text>
      <text x="510" y="-40" writing-mode="tb">0011 1010 0101<animate attributeName="y" from="-140" to="340" dur="5.2s" repeatCount="indefinite"/></text>
      <text x="550" y="-120" writing-mode="tb">1010 0101 1100<animate attributeName="y" from="-220" to="340" dur="8.1s" repeatCount="indefinite"/></text>
    </g>
    <rect width="600" height="320" fill="url(#fade)"/>
    <rect width="600" height="5" fill="#22c55e" fill-opacity=".85"/>

    <text x="36" y="54" fill="#22c55e" font-family="'Fira Code',Consolas,monospace" font-size="15" letter-spacing="4">03 · FOUNDATION</text>
    <text x="34" y="116" fill="#ffffff" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="800">Tera</text>
    <text x="36" y="150" fill="#86efac" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="21">The base layer TeraMyst runs on</text>
    <text fill="#94a3b8" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="19">
      <tspan x="36" y="190">App Router workspace with typed data</tspan>
      <tspan x="36" y="216">access and end-to-end tests.</tspan>
    </text>

    <g font-family="'Fira Code',Consolas,monospace" font-size="14" text-anchor="middle">
      <rect x="36"  y="240" width="116" height="30" rx="15" fill="#05170f" stroke="#22c55e" stroke-opacity=".5"/><text x="94"  y="260" fill="#86efac">TypeScript</text>
      <rect x="162" y="240" width="88"  height="30" rx="15" fill="#05170f" stroke="#22c55e" stroke-opacity=".5"/><text x="206" y="260" fill="#86efac">Drizzle</text>
      <rect x="260" y="240" width="108" height="30" rx="15" fill="#05170f" stroke="#22c55e" stroke-opacity=".5"/><text x="314" y="260" fill="#86efac">Playwright</text>
    </g>

    <g transform="translate(470 240)">
      <rect width="94" height="30" rx="15" fill="#1a0f05" stroke="#facc15" stroke-opacity=".5"/>
      <circle cx="18" cy="15" r="4.5" fill="#facc15"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="56" y="20" text-anchor="middle" fill="#facc15" font-family="'Fira Code',Consolas,monospace" font-size="13" letter-spacing="2">EARLY</text>
    </g>

    <text x="36" y="298" fill="#475569" font-family="'Fira Code',Consolas,monospace" font-size="13">AkshayManojkp/Tera  →</text>
  </g>
  <rect x=".5" y=".5" width="599" height="319" rx="22" fill="none" stroke="#22c55e" stroke-opacity=".3"/>
</svg>
