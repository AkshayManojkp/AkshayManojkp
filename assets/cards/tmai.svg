<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="TMai — TeraMyst's AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/><stop offset=".55" stop-color="#0b1230"/><stop offset="1" stop-color="#061d23"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00f5d4"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#00f5d4" stop-opacity=".18"/><stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="6" height="300" fill="url(#edge)"/>

    <!-- core: same orbit language as the TeraMyst hero -->
    <circle cx="1010" cy="150" r="170" fill="url(#halo)"/>
    <g fill="none" stroke="#00f5d4">
      <circle cx="1010" cy="150" r="118" stroke-opacity=".14" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 1010 150" to="360 1010 150" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="150" r="82" stroke-opacity=".28" stroke-dasharray="14 10">
        <animateTransform attributeName="transform" type="rotate" from="360 1010 150" to="0 1010 150" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="150" r="44" stroke-opacity=".7" fill="#071225" filter="url(#glow)"/>
    </g>
    <g filter="url(#glow)">
      <circle r="5" fill="#a78bfa">
        <animateMotion dur="9s" repeatCount="indefinite" path="M1010 32 A118 118 0 1 1 1009.9 32"/>
      </circle>
      <circle r="4" fill="#00f5d4">
        <animateMotion dur="6s" repeatCount="indefinite" path="M1092 150 A82 82 0 1 1 1092 150.1"/>
      </circle>
    </g>
    <text x="1010" y="158" text-anchor="middle" fill="#ffffff" font-family="'Fira Code',Consolas,monospace" font-size="22" font-weight="700" letter-spacing="2">TM</text>

    <!-- copy -->
    <text x="56" y="62" fill="#00f5d4" font-family="'Fira Code',Consolas,monospace" font-size="16" letter-spacing="4">01 · FLAGSHIP · TERAMYST</text>
    <text x="52" y="138" fill="#ffffff" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="2">TMai</text>
    <text x="250" y="138" fill="#a5f3fc" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500">TeraMyst's AI assistant</text>
    <text x="56" y="180" fill="#94a3b8" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="21">Multi-model chat with streaming responses, auth and persistent history.</text>

    <!-- stack chips -->
    <g font-family="'Fira Code',Consolas,monospace" font-size="15" text-anchor="middle">
      <rect x="56"  y="212" width="104" height="32" rx="16" fill="#071225" stroke="#00f5d4" stroke-opacity=".45"/><text x="108" y="233" fill="#67e8f9">Next.js</text>
      <rect x="170" y="212" width="96"  height="32" rx="16" fill="#071225" stroke="#00f5d4" stroke-opacity=".45"/><text x="218" y="233" fill="#67e8f9">AI SDK</text>
      <rect x="276" y="212" width="112" height="32" rx="16" fill="#071225" stroke="#00f5d4" stroke-opacity=".45"/><text x="332" y="233" fill="#67e8f9">Postgres</text>
      <rect x="398" y="212" width="104" height="32" rx="16" fill="#071225" stroke="#00f5d4" stroke-opacity=".45"/><text x="450" y="233" fill="#67e8f9">Auth.js</text>
    </g>

    <!-- status -->
    <g transform="translate(560 212)">
      <rect width="138" height="32" rx="16" fill="#1a0f05" stroke="#facc15" stroke-opacity=".5"/>
      <circle cx="20" cy="16" r="5" fill="#facc15"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="80" y="21" text-anchor="middle" fill="#facc15" font-family="'Fira Code',Consolas,monospace" font-size="14" letter-spacing="2">IN BUILD</text>
    </g>

    <text x="56" y="276" fill="#475569" font-family="'Fira Code',Consolas,monospace" font-size="14">github.com/AkshayManojkp/teramystai  →</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="24" fill="none" stroke="#00f5d4" stroke-opacity=".3"/>
</svg>
