<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Portfolio — In Search of Magic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/><stop offset="1" stop-color="#0f0b26"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <rect width="600" height="320" fill="url(#grid)"/>
    <rect width="600" height="5" fill="#a78bfa" fill-opacity=".85"/>

    <!-- sparkles: "in search of magic" -->
    <g fill="#a78bfa" filter="url(#glow)">
      <path d="M520 70l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></path>
      <path d="M552 118l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#00f5d4"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M490 128l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"><animate attributeName="opacity" values=".3;.9;.3" dur="4s" repeatCount="indefinite"/></path>
    </g>

    <text x="36" y="54" fill="#a78bfa" font-family="'Fira Code',Consolas,monospace" font-size="15" letter-spacing="4">02 · LIVE SITE</text>
    <text x="34" y="116" fill="#ffffff" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="800">Portfolio</text>
    <text x="36" y="150" fill="#c4b5fd" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="21" font-style="italic">In Search of Magic</text>
    <text fill="#94a3b8" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="19">
      <tspan x="36" y="190">Hand-built personal site, shipped on every</tspan>
      <tspan x="36" y="216">push through GitHub Actions.</tspan>
    </text>

    <g font-family="'Fira Code',Consolas,monospace" font-size="14" text-anchor="middle">
      <rect x="36"  y="240" width="76"  height="30" rx="15" fill="#120c2a" stroke="#a78bfa" stroke-opacity=".5"/><text x="74"  y="260" fill="#c4b5fd">HTML</text>
      <rect x="122" y="240" width="64"  height="30" rx="15" fill="#120c2a" stroke="#a78bfa" stroke-opacity=".5"/><text x="154" y="260" fill="#c4b5fd">CSS</text>
      <rect x="196" y="240" width="96"  height="30" rx="15" fill="#120c2a" stroke="#a78bfa" stroke-opacity=".5"/><text x="244" y="260" fill="#c4b5fd">Actions</text>
    </g>
    <g transform="translate(478 240)">
      <rect width="86" height="30" rx="15" fill="#04201a" stroke="#34d399" stroke-opacity=".6"/>
      <circle cx="18" cy="15" r="4.5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="52" y="20" text-anchor="middle" fill="#34d399" font-family="'Fira Code',Consolas,monospace" font-size="13" letter-spacing="2">LIVE</text>
    </g>

    <text x="36" y="298" fill="#475569" font-family="'Fira Code',Consolas,monospace" font-size="13">akshay-portfolio  →</text>
  </g>
  <rect x=".5" y=".5" width="599" height="319" rx="22" fill="none" stroke="#a78bfa" stroke-opacity=".3"/>
</svg>
