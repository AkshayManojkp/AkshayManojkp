name: contribution-snake

# Rebuilds the contribution graph from real GitHub activity
# and publishes it to the `output` branch used by the README.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#EA580C&color_dots=#161b22,#4a1d05,#7c2d12,#c2410c,#f97316
            dist/snake-light.svg?color_snake=#EA580C&color_dots=#ebedf0,#fed7aa,#fdba74,#fb923c,#ea580c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
